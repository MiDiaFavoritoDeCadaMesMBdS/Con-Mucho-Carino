<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuestra Galaxia 3D 🌌</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #03020a;
            font-family: 'Arial', sans-serif;
        }
        #canvas3d {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .main-title {
            position: absolute;
            top: 10%;
            width: 100%;
            text-align: center;
            color: #ff4b91;
            font-size: 1.8rem;
            font-weight: bold;
            z-index: 10;
            text-shadow: 0 0 15px rgba(255, 75, 145, 0.8);
            pointer-events: none;
        }
        .hint {
            position: absolute;
            bottom: 5%;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.8rem;
            z-index: 10;
            pointer-events: none;
        }
    </style>
    <script src="https://cloudflare.com"></script>
</head>
<body>

    <div class="main-title">Feliz Cumpleaños Amor 💞</div>
    <div class="hint">Toca y mueve la pantalla para explorar el espacio 3D 🌌</div>

    <canvas id="canvas3d"></canvas>

    <script>
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2('#140526', 0.035);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas3d'), antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        camera.position.z = 18;

        // UNIVEROS DE ESTRELLAS CENTRAL (CORAZÓN)
        function getHeartPoint(t) {
            return {
                x: 16 * Math.pow(Math.sin(t), 3),
                y: 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t)
            };
        }

        const heartCount = 3000;
        const heartGeo = new THREE.BufferGeometry();
        const heartPos = new Float32Array(heartCount * 3);
        const heartColors = new Float32Array(heartCount * 3);

        const cRosa = new THREE.Color('#ff4b91');
        const cPastel = new THREE.Color('#ffb6d9');

        for (let i = 0; i < heartCount; i++) {
            const t = Math.random() * Math.PI * 2;
            const point = getHeartPoint(t);
            const factor = 0.25;

            heartPos[i * 3] = point.x * factor + (Math.random() - 0.5) * 0.4;
            heartPos[i * 3 + 1] = point.y * factor * 1 + (Math.random() - 0.5) * 0.4;
            heartPos[i * 3 + 2] = (Math.random() - 0.5) * 2; 

            const col = Math.random() > 0.4 ? cRosa : cPastel;
            heartColors[i * 3] = col.r;
            heartColors[i * 3 + 1] = col.g;
            heartColors[i * 3 + 2] = col.b;
        }
        heartGeo.setAttribute('position', new THREE.BufferAttribute(heartPos, 3));
        heartGeo.setAttribute('color', new THREE.BufferAttribute(heartColors, 3));

        const heartMat = new THREE.PointsMaterial({ size: 0.12, vertexColors: true, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending, depthWrite: false });
        const heartSystem = new THREE.Points(heartGeo, heartMat);
        scene.add(heartSystem);

        // LIENZO PARA CREAR TEXTOS Y EMOJIS EN 3D
        function createTextTexture(text, isEmoji = false) {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = isEmoji ? 'rgba(0,0,0,0)' : 'rgba(255,255,255,0.9)';
            ctx.font = isEmoji ? 'bold 70px Arial' : 'bold 36px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            if(!isEmoji) {
                ctx.shadowColor = '#ffffff';
                ctx.shadowBlur = 10;
            }
            ctx.fillText(text, 256, 64);
            return new THREE.CanvasTexture(canvas);
        }

        // COORDENADAS CORREGIDAS [X, Y, Z]
        const elementosSuelto = [
            { text: "Mi razón de ser ❤️", pos: [-8, 4, -4], isEmoji: false },
            { text: "Mi corazón te elige 💖", pos: [8, -3, -2], isEmoji: false },
            { text: "Para toda la eternidad ♾️", pos: [7, 4, -5], isEmoji: false },
            { text: "🐱🎀", pos: [-5, -4, 2], isEmoji: true }, 
            { text: "🕷️🕸️", pos:, isEmoji: true },   
            { text: "🐱✨", pos: [6, -5, -3], isEmoji: true },
            { text: "🕷️❤️", pos: [-7, 1, -2], isEmoji: true }
        ];

        elementosSuelto.forEach(item => {
            const texture = createTextTexture(item.text, item.isEmoji);
            const mat = new THREE.SpriteMaterial({ map: texture, transparent: true, blending: THREE.AdditiveBlending });
            const sprite = new THREE.Sprite(mat);
            sprite.position.set(item.pos[0], item.pos[1], item.pos[2]);
            sprite.scale.set(item.isEmoji ? 2.5 : 6, item.isEmoji ? 1.25 : 1.5, 1);
            heartSystem.add(sprite); // Se vuelven parte de la galaxia giratoria
        });

        // PORE DE ESTRELLAS DE FONDO LEJANO
        const bgCount = 1500;
        const bgGeo = new THREE.BufferGeometry();
        const bgPos = new Float32Array(bgCount * 3);
        for(let i=0; i<bgCount; i++) {
            bgPos[i*3] = (Math.random() - 0.5) * 80;
            bgPos[i*3+1] = (Math.random() - 0.5) * 80;
            bgPos[i*3+2] = (Math.random() - 0.5) * 80;
        }
        bgGeo.setAttribute('position', new THREE.BufferAttribute(bgPos, 3));
        const bgMat = new THREE.PointsMaterial({ size: 0.08, color: '#ffffff', transparent: true, opacity: 0.5 });
        const bgSystem = new THREE.Points(bgGeo, bgMat);
        scene.add(bgSystem);

        // MOVIMIENTO INTERACTIVO CON RATÓN O TOUCH
        let mouseX = 0, mouseY = 0;
        let targetX = 0, targetY = 0;

        function moverEspacio(e) {
            const x = e.clientX || (e.touches && e.touches[0].clientX);
            const y = e.clientY || (e.touches && e.touches[0].clientY);
            if(x && y) {
                mouseX = (x - window.innerWidth / 2) / (window.innerWidth / 2);
                mouseY = (y - window.innerHeight / 2) / (window.innerHeight / 2);
            }
        }
        window.addEventListener('mousemove', moverEspacio);
        window.addEventListener('touchmove', moverEspacio);

        function tick() {
            requestAnimationFrame(tick);

            heartSystem.rotation.y += 0.002;
            bgSystem.rotation.y += 0.0005;

            targetX = mouseX * 0.7;
            targetY = mouseY * 0.7;
            heartSystem.rotation.y += (targetX - heartSystem.rotation.y) * 0.05;
            heartSystem.rotation.x += (targetY - heartSystem.rotation.x) * 0.05;

            renderer.render(scene, camera);
        }
        tick();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
